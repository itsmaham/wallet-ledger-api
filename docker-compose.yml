name: wallet-ledger

x-db-env: &db-env
  DATABASE_URL: postgresql://ledger:ledger@db:5432/ledger
  PGHOST: db
  PGUSER: ledger
  PGPASSWORD: ledger
  PGDATABASE: ledger

services:
  db:
    image: postgres:16.4
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    # Sized for a laptop-class reviewer machine (~8 GB RAM for Docker).
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - wal_buffers=16MB
      - -c
      - max_wal_size=8GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - random_page_cost=1.1
      - -c
      - jit=off
      # Durability stays on: a 200 means the write survived a crash.
      - -c
      - synchronous_commit=on
    shm_size: 1g
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/db:ro
    ports:
      # Published on localhost only, on an unusual port to avoid clashing with
      # a local PostgreSQL. Reviewers can also use: docker compose exec db psql
      - "127.0.0.1:${DB_HOST_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    environment:
      <<: *db-env
      API_TOKEN: ${API_TOKEN:-recruitment-test-token}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
      DB_POOL_MAX: ${DB_POOL_MAX:-25}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 15s
    restart: unless-stopped

  # docker compose --profile seed run --rm seed
  # SEED_SCALE=0.1 for ~1M rows (default 1 = ~10.4M rows).
  seed:
    image: postgres:16.4
    profiles: ["seed"]
    environment:
      <<: *db-env
      SEED_SCALE: ${SEED_SCALE:-1}
    volumes:
      - ./db:/db:ro
    entrypoint: ["sh", "/db/seed.sh"]
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started

  # docker compose --profile test run --rm tests
  tests:
    build: ./tests
    profiles: ["test"]
    environment:
      <<: *db-env
      API_URL: http://api:8080
      API_TOKEN: ${API_TOKEN:-recruitment-test-token}
    depends_on:
      api:
        condition: service_started

  # docker compose --profile loadtest run --rm loadtest
  loadtest:
    image: grafana/k6:0.54.0
    profiles: ["loadtest"]
    environment:
      BASE_URL: http://api:8080
      API_TOKEN: ${API_TOKEN:-recruitment-test-token}
      VUS: ${VUS:-100}
      DURATION: ${DURATION:-60s}
      SEED_USERS: ${SEED_USERS:-100000}
      LABEL: ${LABEL:-run}
    volumes:
      - ./loadtest:/scripts
    command: ["run", "--quiet", "/scripts/k6.js"]
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
